name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate skill structure and marketplace manifest
        run: node scripts/validate-skills.mjs

      - name: Shellcheck bundled scripts
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          find skills -path '*/scripts/*.sh' -print0 | xargs -0 -r shellcheck --severity=warning
